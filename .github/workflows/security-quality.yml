name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q oauth_audit tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m oauth_audit.cli data/sample_clients.json --output /tmp/oauth-assessment.md
      - name: Validate generated report
        run: |
          test -s /tmp/oauth-assessment.md
          grep -q "OAuth/OIDC Security Assessment" /tmp/oauth-assessment.md
          grep -q "OAUTH-PKCE" /tmp/oauth-assessment.md
