[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth-security-lab"
version = "0.1.0"
description = "Defensive OAuth/OIDC configuration assessment toolkit"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["oauth_audit*"]
